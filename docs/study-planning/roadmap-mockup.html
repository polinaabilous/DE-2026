function panelControls(){const ids=panel.kind==='lesson'?allIds(subjectBy(lessons[panel.id].subject)):milestones.map(m=>m.id),i=ids.indexOf(panel.id);return `<div class="panel-controls"><button class="panel-icon" data-adjacent="${ids[i-1]||''}" ${i===0?'disabled':''} aria-label="Previous ${panel.kind==='lesson'?'lesson':'stage'}" title="Previous ${panel.kind==='lesson'?'lesson':'stage'}"><span style="display:inline-flex;transform:rotate(180deg)">${icon('arrow')}</span></button><button class="panel-icon" data-adjacent="${ids[i+1]||''}" ${i===ids.length-1?'disabled':''} aria-label="Next ${panel.kind==='lesson'?'lesson':'stage'}" title="Next ${panel.kind==='lesson'?'lesson':'stage'}">${icon('arrow')}</button><button class="panel-icon close" data-close aria-label="Close side panel" title="Close (Esc)">${icon('close')}</button></div>`}
function panelFooter(){if(panel.kind==='lesson'){const l=lessons[panel.id],set=checks.get(l.id);return `<p>${done.has(l.id)?'Completed in demo':set.size+' / '+l.checks.length+' checks confirmed'}<br>${l.prereqs.some(id=>!known(id))?'Finish the prerequisite lessons first.':'Learning updates portfolio readiness.'}</p><button class="btn primary" id="complete-lesson" ${done.has(l.id)||set.size!==l.checks.length||l.prereqs.some(id=>!known(id))?'disabled':''}>${done.has(l.id)?'Lesson complete':'Complete lesson'} ${icon('check')}</button>`}const m=milestoneBy(panel.id),set=buildChecks.get(m.id);return `<p>${built.has(m.id)?'Completed in demo':ready(m)?'Ready to build':'Prerequisites needed'}<br>Mark complete after building the deliverable.</p><button class="btn primary" id="complete-build" ${built.has(m.id)||!ready(m)||set.size!==m.checks.length?'disabled':''}>${built.has(m.id)?'Stage built':'Mark stage built'} ${icon('check')}</button>`}
function renderPanel(scroll=0){const isLesson=panel.kind==='lesson',item=isLesson?lessons[panel.id]:milestoneBy(panel.id),parent=panelTrail.at(-1);const status=isLesson?(done.has(item.id)?'Completed':'Lesson'):(built.has(item.id)?'Built':ready(item)?'Ready to build':'Prerequisites needed');$('#detail-panel').innerHTML=`<div class="panel-shell"><header class="panel-head"><div class="row spread"><p class="eyebrow">${isLesson?subjectBy(item.subject).title:'Portfolio · Stage '+(milestones.indexOf(item)+1)}</p>${panelControls()}</div>${parent?`<button class="panel-context" data-parent>Related ${parent.kind==='lesson'?'lesson':'stage'}: ${panelTitle(parent)}</button>`:''}<h2 id="panel-title" tabindex="-1">${item.title||item.name}</h2><p class="panel-description">${isLesson?(item.summary||'Learn the concepts, practise them and check your understanding.'):item.description}</p><span class="badge ${status==='Prerequisites needed'?'neutral':''}">${status}</span></header><div class="panel-scroll">${isLesson?lessonBody(item):stageBody(item)}</div><footer class="panel-foot">${panelFooter()}</footer></div>`;$('.panel-scroll').scrollTop=scroll}
function initializeChecks(kind,id){const map=kind==='lesson'?checks:buildChecks,complete=kind==='lesson'?done.has(id):built.has(id),item=kind==='lesson'?lessons[id]:milestoneBy(id);if(!map.has(id))map.set(id,new Set(complete?item.checks.map((_,i)=>i):[]))}
function rememberOpener(){const el=document.activeElement;rootOpener={el,selector:el?.dataset.lesson?`#main [data-lesson="${el.dataset.lesson}"]`:el?.dataset.build?`#main [data-build="${el.dataset.build}"]`:null}}
function openPanel(kind,id,{adjacent=false}={}){if(kind==='lesson'&&!lessons[id]||kind==='stage'&&!milestoneBy(id))return;const dialog=$('#detail-panel');if(dialog.open){if(panel.kind===kind&&panel.id===id)return;if(!adjacent){panelTrail.push({...panel,scroll:$('.panel-scroll').scrollTop});if(panelTrail.length>6)panelTrail.shift()}}else{rememberOpener();panelTrail=[]}panel={kind,id};initializeChecks(kind,id);renderPanel();if(!dialog.open){dialog.showModal();document.body.style.overflow='hidden'}$('#panel-title').focus({preventScroll:true})}
function openLesson(id){openPanel('lesson',id)}
function openBuild(id){openPanel('stage',id)}
function closePanel(){if($('#detail-panel').open)$('#detail-panel').close()}
function returnToParent(){const parent=panelTrail.pop();if(!parent)return;panel={kind:parent.kind,id:parent.id};renderPanel(parent.scroll);$('#panel-title').focus({preventScroll:true})}
function refreshProgress(){const scroll=$('.panel-scroll').scrollTop,y=window.scrollY;render();window.scrollTo(0,y);renderPanel(scroll)}
function updateFooter(){const active=document.activeElement;$('.panel-foot').innerHTML=panelFooter();if(active?.isConnected)active.focus({preventScroll:true})}
function openSubject(id){closePanel();subject=id;view='topics';highlight=null;render();$('#area-'+id)?.scrollIntoView({block:'start',behavior:'instant'})}
function openRoad(id=null){closePanel();view='roadmap';highlight=id;render();if(id)$('#road-'+id).scrollIntoView({block:'start',behavior:'instant'});else window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){closePanel();view=b.dataset.view;highlight=null;render();window.scrollTo({top:0,behavior:'instant'})}
 else if(b.dataset.subject)openSubject(b.dataset.subject);
 else if(b.dataset.lesson)openLesson(b.dataset.lesson);
 else if(b.dataset.road)openRoad(b.dataset.road);
 else if(b.dataset.build)openBuild(b.dataset.build);
 else if(b.hasAttribute('data-close'))closePanel();
 else if(b.hasAttribute('data-parent'))returnToParent();
 else if(b.dataset.adjacent)openPanel(panel.kind,b.dataset.adjacent,{adjacent:true});
 else if(b.id==='complete-lesson'){const l=lessons[panel.id];if(checks.get(l.id).size!==l.checks.length||l.prereqs.some(id=>!known(id)))return;done.add(l.id);refreshProgress();$('#complete-lesson').focus({preventScroll:true});notify('Lesson complete. Portfolio readiness updated in the roadmap.')}
 else if(b.id==='complete-build'){const m=milestoneBy(panel.id);if(!ready(m)||buildChecks.get(m.id).size!==m.checks.length)return;built.add(m.id);refreshProgress();notify('Stage built in the demo. Dependent stages updated.')}
 else if(b.id==='reset'){closePanel();done=new Set(['grain']);built.clear();checks.clear();buildChecks.clear();panel=null;panelTrail=[];view='topics';subject='sql';highlight=null;expandedAreas.clear();render();window.scrollTo(0,0);notify('Demo reset. Real tracker data is not connected.')}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.matches('[data-check]')){const set=checks.get(panel.id),n=Number(el.dataset.check);el.checked?set.add(n):set.delete(n);updateFooter()}
 if(el.matches('[data-build-check]')){const set=buildChecks.get(panel.id),n=Number(el.dataset.buildCheck);el.checked?set.add(n):set.delete(n);updateFooter()}});
document.addEventListener('toggle',e=>{if(e.target.matches?.('.area-more')&&e.target.isConnected){const id=e.target.dataset.area;e.target.open?expandedAreas.add(id):expandedAreas.delete(id)}},true);
$('#detail-panel').addEventListener('close',()=>{document.body.style.overflow='';panel=null;panelTrail=[];if(rootOpener?.el?.isConnected)rootOpener.el.focus({preventScroll:true});else if(rootOpener?.selector)document.querySelector(rootOpener.selector)?.focus({preventScroll:true})});
$('#detail-panel').addEventListener('click',e=>{if(e.target===$('#detail-panel')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right)closePanel()}});
render();

</script></body></html>
