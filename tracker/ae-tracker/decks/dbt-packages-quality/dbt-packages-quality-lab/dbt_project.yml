name: leafy
version: "1.0.0"
profile: leafy                       # which entry in profiles.yml to use
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target"]            # folders that `dbt clean` deletes

flags:
  send_anonymous_usage_stats: false  # no telemetry from this project

vars:                                # project variables, read with var()
  dim_date_start: "2026-03-01"
  dim_date_end: "2026-03-07"
  funnel_event_types: ["page_view", "add_to_cart", "purchase", "refund"]

models:
  leafy:                             # this project
    staging:                         # = models/staging/
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      +tags: ["mart"]

seeds:
  leafy:
    +schema: seeds
  dbt_project_evaluator:              # use our exceptions seed instead of the package's empty one
    dbt_project_evaluator_exceptions:
      +enabled: false

data_tests:
  dbt_project_evaluator:              # warn locally; CI sets the variable to error
    +severity: "{{ env_var('DBT_PROJECT_EVALUATOR_SEVERITY', 'warn') }}"

dispatch:                            # dbt-project-evaluator on DuckDB needs its macros first
  - macro_namespace: dbt
    search_order: ["dbt_project_evaluator", "dbt"]
