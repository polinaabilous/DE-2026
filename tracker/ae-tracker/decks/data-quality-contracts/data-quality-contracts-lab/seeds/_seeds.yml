version: 2

seeds:
  - name: customers
    description: Customer master list exported from the CRM. One row per customer.
    config:
      column_types: {customer_id: varchar, customer_name: varchar, city: varchar, signup_date: date}
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: products
    description: Product catalogue. One row per product.
    config:
      column_types: {product_id: varchar, product_name: varchar, category: varchar, list_price: "decimal(10,2)"}
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: known_differences
    description: Explained reconciliation differences between fct_orders and the payment provider. Every row needs a ticket.
    config:
      column_types: {order_id: varchar, amount_usd: "decimal(10,2)", reason: varchar, ticket: varchar}
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: ticket
        data_tests: [not_null]
